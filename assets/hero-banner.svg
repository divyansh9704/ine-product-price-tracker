<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050714" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0e3a5a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050714" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0.1; }
        50% { opacity: 0.35; }
        100% { transform: translateY(400px); opacity: 0.1; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 25px rgba(129, 140, 248, 0.8)); }
      }
      @keyframes ping {
        0% { r: 4px; opacity: 1; }
        100% { r: 16px; opacity: 0; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-15px) translateX(10px); }
      }
      .scan { animation: scanline 6s linear infinite; }
      .glow-title { animation: pulseGlow 4s ease-in-out infinite; }
      .ping-dot { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
      .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 7s ease-in-out infinite reverse; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" rx="24" fill="#050714"/>
  <rect width="1200" height="400" rx="24" fill="url(#bgGlow1)"/>
  <rect width="1200" height="400" rx="24" fill="url(#bgGlow2)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200 M0,300 H1200 M0,350 H1200"/>
    <path d="M100,0 V400 M200,0 V400 M300,0 V400 M400,0 V400 M500,0 V400 M600,0 V400 M700,0 V400 M800,0 V400 M900,0 V400 M100,0 V400 M1100,0 V400"/>
  </g>

  <!-- Animated Scanning Beam -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#beamGrad)" stroke-width="2" class="scan"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="398" rx="23" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Glowing Floating Cyber Nodes -->
  <g class="particle-1">
    <circle cx="150" cy="110" r="3" fill="#38bdf8" opacity="0.7"/>
    <circle cx="1050" cy="90" r="4" fill="#818cf8" opacity="0.6"/>
  </g>
  <g class="particle-2">
    <circle cx="180" cy="320" r="4" fill="#c084fc" opacity="0.5"/>
    <circle cx="980" cy="300" r="3" fill="#38bdf8" opacity="0.7"/>
  </g>

  <!-- Top Pill / Badge -->
  <g transform="translate(425, 42)">
    <rect width="350" height="30" rx="15" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="15" r="4" fill="#10b981"/>
    <circle cx="20" cy="15" r="4" fill="#10b981" class="ping-dot"/>
    <text x="36" y="20" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="1">
      INE INTERN ASSIGNMENT • LIVE &amp; AUTOMATED
    </text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 145)" text-anchor="middle">
    <text class="glow-title" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
      PRODUCT PRICE TRACKER
    </text>
    <text y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="0.2">
      Resilient Web Scraping Engine • 2-Hour Autonomous Scheduling • Enterprise Analytics
    </text>
  </g>

  <!-- Feature Telemetry Chips -->
  <g transform="translate(100, 235)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="230" height="54" rx="14" fill="#090d1e" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="230" height="54" rx="14" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
      <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">ANTI-SCRAPING BYPASS</text>
      <text x="20" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Wasm + PoW Direct Client</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(255, 0)">
      <rect width="230" height="54" rx="14" fill="#090d1e" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="230" height="54" rx="14" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.3"/>
      <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#818cf8" letter-spacing="1">DATA INTEGRITY</text>
      <text x="20" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Zero Bad Data • Atomic RPC</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(510, 0)">
      <rect width="230" height="54" rx="14" fill="#090d1e" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="230" height="54" rx="14" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.3"/>
      <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#c084fc" letter-spacing="1">VOLATILITY SAFEGUARD</text>
      <text x="20" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">≥40% Jump Re-fetch Verify</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(765, 0)">
      <rect width="235" height="54" rx="14" fill="#090d1e" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="235" height="54" rx="14" fill="none" stroke="#34d399" stroke-width="1" opacity="0.3"/>
      <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399" letter-spacing="1">CLOUD FOOTPRINT</text>
      <text x="20" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">~80 MB RSS (Render Safe)</text>
    </g>
  </g>

  <!-- Bottom CTA Pills -->
  <g transform="translate(600, 335)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#64748b">
      Target: <tspan fill="#94a3b8" font-family="'JetBrains Mono', monospace">https://demo.inelabteamdev.com</tspan> • Automated via <tspan fill="#38bdf8">cron-job.org</tspan> • Deployed on <tspan fill="#c084fc">Vercel &amp; Render</tspan>
    </text>
  </g>
</svg>
