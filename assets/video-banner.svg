<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <style>
      @keyframes playPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.5)); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(99, 102, 241, 0.8)); }
      }
      @keyframes ringExpand {
        0% { r: 38px; opacity: 0.9; }
        100% { r: 62px; opacity: 0; }
      }
      .play-btn { transform-origin: 200px 160px; animation: playPulse 2.5s ease-in-out infinite; }
      .pulse-ring { animation: ringExpand 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="url(#borderGlow)" stroke-width="1.5"/>

  <!-- Left Side: Pulsing Play Button Interface -->
  <g>
    <!-- Ripple circle -->
    <circle cx="200" cy="160" r="38" fill="none" stroke="#38bdf8" stroke-width="2" class="pulse-ring"/>
    
    <!-- Outer Play Button Glow -->
    <g class="play-btn">
      <circle cx="200" cy="160" r="42" fill="url(#playGrad)"/>
      <polygon points="190,142 220,160 190,178" fill="#ffffff"/>
    </g>
  </g>

  <!-- Right Side: Content & Description -->
  <g transform="translate(320, 95)">
    <!-- Badge -->
    <rect width="180" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">
      ▶ 2–4 MIN VIDEO DEMO
    </text>

    <!-- Main Title -->
    <text y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#f8fafc">
      Watch Live System Demonstration on Loom
    </text>

    <!-- Bullets / Highlights -->
    <text y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
      • Observable Headed Chromium Scraper with Simulated Human Dwell Time &amp; Decoy Bypass
    </text>
    <text y="116" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
      • Real-time Fault Injection: HTTP 503 Jittered Exponential Backoff &amp; Invariant Verification
    </text>
    <text y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
      • Full-Stack Walkthrough: Bento Metric Grid, Bloomberg Gradient AreaChart &amp; CSV Export
    </text>
  </g>

  <!-- Top-Right Accent Tag -->
  <g transform="translate(1020, 35)">
    <rect width="130" height="28" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="65" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748b">
      1080p HD
    </text>
  </g>
</svg>
